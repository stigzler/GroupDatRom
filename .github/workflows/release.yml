name: Build and Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Read version from csproj
        id: ver
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content "./GroupDatRom.csproj"
          $ver = ($csproj.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1).Trim()
          if (-not $ver) { throw "No <Version> found in GroupDatRom.csproj" }
          $tag = if ($ver.StartsWith("v") -or $ver.StartsWith("V")) { $ver } else { "v$ver" }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Check if release already exists
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          gh release view $env:TAG *> $null
          $exists = if ($LASTEXITCODE -eq 0) { "true" } else { "false" }
          "exists=$exists" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Setup .NET
        if: steps.check.outputs.exists == 'false'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Release
        if: steps.check.outputs.exists == 'false'
        run: dotnet publish ./GroupDatRom.csproj -c Release -r win-x64 --self-contained false -o ./publish_output

      - name: Zip published folder
        if: steps.check.outputs.exists == 'false'
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          Compress-Archive -Path "./publish_output/*" -DestinationPath "./GroupDatRom-$tag-win-x64.zip" -Force

      - name: Create GitHub Release and upload zip
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ steps.ver.outputs.tag }}
          files: GroupDatRom-*-win-x64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true